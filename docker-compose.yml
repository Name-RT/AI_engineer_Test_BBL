# ==============================================================================
# Docker Compose: AI Policy Assistant
# 1-Click Launch: docker compose up -d
# ==============================================================================

services:
  rag-assistant:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-policy-assistant:latest
    container_name: ai_policy_assistant
    restart: unless-stopped
    ports:
      - "7861:7861"
    env_file:
      - .env
    volumes:
      - ./knowledge_base.txt:/app/knowledge_base.txt:ro
      - ./config.yaml:/app/config.yaml:ro
      - chroma_data:/app/chroma_db
    environment:
      - PYTHONUNBUFFERED=1
      - GRADIO_SERVER_NAME=0.0.0.0
      - GRADIO_SERVER_PORT=7861
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7861/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  chroma_data:
    driver: local
